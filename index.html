<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>읽으며 듣기</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --fg:var(--tg-theme-text-color,#16181c);
  --dim:var(--tg-theme-hint-color,#8b949e);
  --accent:var(--tg-theme-button-color,#2f7de1);
  --accent-fg:var(--tg-theme-button-text-color,#ffffff);
  --panel:var(--tg-theme-secondary-bg-color,#f2f4f7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{font:17px/1.85 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:104px}
#bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;
  border-bottom:1px solid color-mix(in srgb,var(--dim) 28%,transparent)}
#title{font-size:15px;font-weight:700;margin:0}
#meta{font-size:12px;color:var(--dim);margin-top:3px}
#doc{padding:18px 16px 40px;max-width:720px;margin:0 auto}
.s{margin:0 0 15px;transition:opacity .25s;cursor:pointer;word-break:keep-all}
.s.done{opacity:.38}
.s.now{opacity:1}
.s .c.read{color:var(--accent);font-weight:600}
.s .c.cur{color:var(--accent-fg);background:var(--accent);border-radius:3px;padding:0 1px}
#ctl{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
  border-top:1px solid color-mix(in srgb,var(--dim) 28%,transparent);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
#play{flex:0 0 auto;width:46px;height:46px;border:0;border-radius:50%;
  background:var(--accent);color:var(--accent-fg);font-size:19px;cursor:pointer}
#seek{flex:1;appearance:none;height:4px;border-radius:2px;background:var(--panel);outline:0}
#seek::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent)}
#time{flex:0 0 auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
#rate{flex:0 0 auto;border:0;border-radius:8px;background:var(--panel);color:var(--fg);
  font-size:13px;padding:7px 8px}
#gate{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center}
#gate h1{font-size:19px;margin:0}
#gate p{color:var(--dim);font-size:13px;margin:0;line-height:1.7}
#go{border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);
  font-size:16px;font-weight:600;padding:15px 40px;cursor:pointer}
#gate.hide{display:none}
.err{color:#d64545}
</style>
</head>
<body>
<div id="gate">
  <h1 id="gateTitle">읽으며 듣기</h1>
  <p id="gateMsg">불러오는 중…</p>
  <button id="go" hidden>▶ 재생</button>
</div>
<header id="bar"><h1 id="title"></h1><div id="meta"></div></header>
<main id="doc"></main>
<footer id="ctl">
  <button id="play" aria-label="재생/일시정지">▶</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0:00</span>
  <select id="rate" aria-label="배속"></select>
</footer>
<audio id="au" preload="auto"></audio>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const $ = id => document.getElementById(id);
const au = $('au'), doc = $('doc');
let SENTS = [];      // [{d, anchors:[{t,p}], t0, t1, el, parts}]
let cur = -1, raf = 0;

function reportKey() {
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp) return String(sp);
  const u = new URL(location.href);
  return u.searchParams.get('r') || decodeURIComponent(u.hash.replace(/^#/, '')) || '';
}

function splitSentences(s) {
  return String(s || '').split(/(?<=[.!?…])\s+|\n+/).map(x => x.trim()).filter(Boolean);
}

const dense = s => String(s || '').replace(/\s+/g, '');

/* 낭독문 기준 단어 타이밍을 화면 원문의 글자 위치로 옮긴다.
   WordBoundary 의 단어 텍스트는 원문 표기와 어긋난다(「+3.2%」→「+3.2」+「퍼센트」, 날짜는 분해).
   그래서 문자열 탐색 대신 '공백 뺀 누적 글자수'로 문장을 배정한다 — 단조 증가라 폭주하지 않는다.
   단어 글자수 합이 낭독문보다 짧게 나오므로 총합 비율 K 로 늘려 오차를 고르게 편다.
   결과: 문장 끝 위치 오차 평균 2.4자(09/18 기업리포트 2,804자 실측). */
function build(data) {
  let pairs = data.sentences;
  if (!pairs || !pairs.length) {
    const sp = splitSentences(data.spoken || data.display || '');
    pairs = sp.map(x => ({ d: x, s: x }));
  }
  const words = (data.words || []).filter(w => dense(w.w).length);
  const bounds = [];
  let acc = 0;
  pairs.forEach(p => { const n = dense(p.s).length; bounds.push([acc, acc + n]); acc += n; });
  const K = acc / (words.reduce((t, w) => t + dense(w.w).length, 0) || 1);

  const out = pairs.map(p => ({ d: p.d, anchors: [], t0: Infinity, t1: 0 }));
  let pos = 0, si = 0;
  words.forEach(w => {
    while (si < bounds.length - 1 && pos >= bounds[si][1]) si++;
    const [a, b] = bounds[si], len = Math.max(1, b - a), s = out[si];
    const ratio = Math.min(1, Math.max(0, (pos - a) / len));
    s.anchors.push({ t: w.s, p: Math.round(ratio * s.d.length) });
    s.t0 = Math.min(s.t0, w.s);
    s.t1 = Math.max(s.t1, w.s + w.d);
    pos += dense(w.w).length * K;
  });

  // 너무 짧아 단어가 하나도 안 걸린 문장은 이웃 시간으로 채운다 — 넘어가며 건너뛰지 않게
  for (let i = 0; i < out.length; i++) {
    if (out[i].anchors.length) continue;
    let prev = i - 1; while (prev >= 0 && !out[prev].anchors.length) prev--;
    let next = i + 1; while (next < out.length && !out[next].anchors.length) next++;
    const t0 = prev >= 0 ? out[prev].t1 : 0;
    const t1 = next < out.length ? out[next].t0 : t0 + 400;
    out[i].t0 = t0; out[i].t1 = Math.max(t0 + 1, t1);
    out[i].anchors = [{ t: t0, p: 0 }];
  }
  return out.filter(s => s.d);
}

function render() {
  doc.innerHTML = '';
  SENTS.forEach((s, i) => {
    const el = document.createElement('p');
    el.className = 's';
    el.textContent = s.d;
    el.onclick = () => { if (isFinite(s.t0)) { au.currentTime = s.t0 / 1000; if (au.paused) play(); } };
    doc.appendChild(el);
    s.el = el;
  });
}

function openSentence(i) {
  const s = SENTS[i];
  s.el.textContent = '';
  const read = document.createElement('span'), c = document.createElement('span'), rest = document.createElement('span');
  read.className = 'c read'; c.className = 'c cur';
  s.el.append(read, c, rest);
  s.parts = { read, c, rest, last: -1 };
}

function closeSentence(i) {
  const s = SENTS[i];
  if (!s) return;
  s.el.textContent = s.d;
  s.parts = null;
}

function posAt(s, ms) {
  const a = s.anchors;
  if (!a.length) return 0;
  if (ms <= a[0].t) return 0;
  for (let i = 0; i < a.length - 1; i++) {
    if (ms < a[i + 1].t) {
      const span = Math.max(1, a[i + 1].t - a[i].t);
      return Math.round(a[i].p + (a[i + 1].p - a[i].p) * ((ms - a[i].t) / span));
    }
  }
  const last = a[a.length - 1], span = Math.max(1, s.t1 - last.t);
  return Math.round(last.p + (s.d.length - last.p) * Math.min(1, (ms - last.t) / span));
}

function tick() {
  const ms = au.currentTime * 1000;
  let i = SENTS.findIndex(s => ms >= s.t0 && ms <= s.t1);
  if (i < 0) {
    i = 0;
    for (let k = 0; k < SENTS.length; k++) if (SENTS[k].t0 <= ms) i = k;
  }
  if (i !== cur) {
    if (cur >= 0) { closeSentence(cur); SENTS[cur].el.classList.add('done'); SENTS[cur].el.classList.remove('now'); }
    cur = i;
    openSentence(cur);
    SENTS[cur].el.classList.add('now');
    SENTS[cur].el.classList.remove('done');
    SENTS.forEach((s, k) => { if (k > cur) s.el.classList.remove('done'); });
    try { SENTS[cur].el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
  }
  const s = SENTS[cur];
  if (s && s.parts) {
    const p = Math.max(0, Math.min(s.d.length, posAt(s, ms)));
    if (p !== s.parts.last) {
      s.parts.last = p;
      s.parts.read.textContent = s.d.slice(0, p);
      s.parts.c.textContent = s.d.slice(p, p + 1);
      s.parts.rest.textContent = s.d.slice(p + 1);
    }
  }
  const d = au.duration || 0;
  if (d) $('seek').value = String(Math.round(au.currentTime / d * 1000));
  $('time').textContent = fmt(au.currentTime) + ' / ' + fmt(d);
  raf = requestAnimationFrame(tick);
}

function fmt(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function play() { au.play().then(() => { $('play').textContent = '⏸'; if (!raf) raf = requestAnimationFrame(tick); }).catch(() => {}); }
function pause() { au.pause(); $('play').textContent = '▶'; cancelAnimationFrame(raf); raf = 0; }

$('play').onclick = () => au.paused ? play() : pause();
au.onended = () => { $('play').textContent = '▶'; cancelAnimationFrame(raf); raf = 0; };
$('seek').oninput = e => { if (au.duration) au.currentTime = au.duration * e.target.value / 1000; };

const RATES = [0.75, 1, 1.15, 1.3, 1.5];
RATES.forEach(r => {
  const o = document.createElement('option');
  o.value = String(r); o.textContent = '×' + r;
  if (r === 1) o.selected = true;
  $('rate').appendChild(o);
});
$('rate').onchange = e => { au.playbackRate = parseFloat(e.target.value); };

function fail(msg) {
  $('gateMsg').innerHTML = '<span class="err">' + msg + '</span>';
  $('go').hidden = true;
}

async function boot() {
  const key = reportKey();
  if (!/^[A-Za-z0-9_\-]{1,64}$/.test(key)) return fail('리포트를 지정하지 않았습니다.<br>텔레그램 캡션의 「읽으며 듣기」 버튼으로 열어 주세요.');
  const base = 'reports/' + key + '/';
  let data;
  try {
    const r = await fetch(base + 'reading.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    return fail('이 리포트의 본문을 찾지 못했습니다. (' + e.message + ')');
  }
  SENTS = build(data);
  if (!SENTS.length) return fail('읽을 내용이 없습니다.');
  render();
  $('title').textContent = data.title || '읽으며 듣기';
  $('meta').textContent = [data.day, data.kind, (data.chars || 0).toLocaleString() + '자'].filter(Boolean).join(' · ');
  document.title = data.title || '읽으며 듣기';
  au.src = base + 'audio.mp3';
  $('gateTitle').textContent = data.title || '읽으며 듣기';
  $('gateMsg').textContent = '글을 따라가며 들으려면 재생을 눌러 주세요.';
  $('go').hidden = false;
  $('go').onclick = () => { $('gate').classList.add('hide'); play(); };
}
boot();
</script>
</body>
</html>
